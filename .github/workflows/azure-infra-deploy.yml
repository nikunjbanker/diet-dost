# GitHub Actions CI/CD: Aspire Infrastructure Provisioning Pipeline
# Target: ACA Environment + Persistent Azure Files SMB Share + VNet Perimeter
# Driven by: .NET Aspire AppHost & infra/infra.bicep
# Three-Stage Enterprise Architecture: Validate -> Preview -> Provision
# Strictly On-Demand (workflow_dispatch only)
# ==============================================================================

name: Aspire - Provision Azure Infrastructure

on:
  workflow_dispatch:
    inputs:
      resourceGroupName:
        description: 'Azure Resource Group name'
        required: false
        type: string
        default: 'rg-dietdost-dev'
      location:
        description: 'Azure region/location'
        required: false
        type: string
        default: 'centralindia'
      environment:
        description: 'Target environment name (e.g. dev, prod)'
        required: true
        type: string
        default: 'dev'
      fileShareQuotaGb:
        description: 'Persistent SQLite SMB file share quota in GB (1 GB for dev)'
        required: false
        type: number
        default: 1
      acrName:
        description: 'Azure Container Registry name (optional, auto-generated if empty)'
        required: false
        type: string
        default: ''
      skipPreFlightGates:
        description: '⚡ Skip Pre-Flight Security & Quality Gates (Admin Only: nikunjbanker)'
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  security-events: write
  actions: read
  pull-requests: write

jobs:
  pre-provisioning-security-scan:
    name: Mandatory Pre-Provisioning Security Gates
    if: inputs.skipPreFlightGates != true || github.actor != 'nikunjbanker'
    uses: ./.github/workflows/security-scan.yml
    secrets: inherit

  pre-provisioning-quality-gate:
    name: Mandatory Pre-Provisioning Quality & Test Gates
    if: inputs.skipPreFlightGates != true || github.actor != 'nikunjbanker'
    uses: ./.github/workflows/quality-test-gate.yml
    secrets: inherit

  # ============================================================================
  # STAGE 1: VALIDATE (Aspire Application Model & Bicep IaC Validation)
  # ============================================================================
  validate-infrastructure:
    name: 'Stage 1: Validate (Aspire & Bicep IaC)'
    needs: [pre-provisioning-security-scan, pre-provisioning-quality-gate]
    if: github.actor == 'nikunjbanker'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    outputs:
      rg_name: ${{ steps.ensure-rg.outputs.rg_name }}
      rg_location: ${{ steps.ensure-rg.outputs.rg_location }}
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 2. Setup .NET 11 SDK
        uses: actions/setup-dotnet@87b7050bc53ea08284295505d98d2aa94301e852 # v4.2.0
        with:
          dotnet-version: '11.0.x'

      - name: 3. Install / Verify Aspire CLI
        run: |
          echo "Installing or updating Aspire CLI..."
          dotnet tool install -g aspire.cli || dotnet tool update -g aspire.cli
          aspire --version

      - name: 4. Pre-Deployment Security Gate - Secret Leak Scan (Gitleaks)
        run: |
          echo "Scanning workspace for accidental secret or credential leaks before provisioning..."
          GITLEAKS_VERSION="8.30.1"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          rm -f gitleaks.tar.gz
          gitleaks detect --source . --verbose --no-git --redact
          echo "✅ Pre-Provisioning Secret Gate Passed: 0 secrets detected."

      - name: 5. Pre-Deployment Security Gate - Bicep IaC Schema & Compilation Validation
        run: |
          echo "Validating Bicep cloud infrastructure templates before provisioning..."
          az bicep build --file infra/infra.bicep
          az bicep build --file infra/app.bicep
          echo "✅ Pre-Provisioning Bicep IaC Gate Passed: Templates compiled successfully."

      - name: 6. Aspire Publish - Validate AppHost Model & Generate Manifests
        run: |
          echo "Evaluating AppHost application model and generating Aspire Bicep manifests..."
          aspire publish --apphost src/Nutrition.AppHost --output-path ./aspire-output --non-interactive
          echo "✅ Aspire deployment pipeline steps executed successfully."

      - name: 7. Azure CLI Authentication (OIDC / Federated Credentials)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/login@d19a4f1b3c068b799dff7574ac265b0144f415fe # v2.2.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: '7b. Azure CLI Authentication (Fallback: Service Principal JSON)'
        if: ${{ env.AZURE_CLIENT_ID == '' }}
        uses: azure/login@d19a4f1b3c068b799dff7574ac265b0144f415fe # v2.2.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 8. Ensure Azure Resource Group Exists (Pre-Flight)
        id: ensure-rg
        run: |
          SUB_ID="${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}"
          if [ -n "$SUB_ID" ]; then
            echo "Setting Azure subscription context to '$SUB_ID'..."
            az account set --subscription "$SUB_ID"
          fi
          RG="${{ inputs.resourceGroupName || vars.AZURE_RESOURCE_GROUP || 'rg-dietdost-dev' }}"
          LOCATION="${{ inputs.location || vars.AZURE_LOCATION || 'centralindia' }}"
          echo "=========================================================="
          echo "Checking if Azure Resource Group '$RG' exists in '$LOCATION'..."
          echo "=========================================================="
          RG_EXISTS=$(az group exists --name "$RG" --output tsv)
          if [ "$RG_EXISTS" = "true" ]; then
            echo "✅ Resource Group '$RG' already exists."
          else
            echo "⚡ Resource Group '$RG' does not exist. Creating now in '$LOCATION'..."
            az group create \
              --name "$RG" \
              --location "$LOCATION" \
              --tags environment="${{ inputs.environment }}" project="diet-dost" managed-by="aspire" \
              --output table
            echo "✅ Created Resource Group '$RG'."
          fi
          if [ "$(az group exists --name "$RG" --output tsv)" != "true" ]; then
            echo "❌ Error: Failed to create or confirm access to Resource Group '$RG'."
            exit 1
          fi
          {
            echo "rg_name=$RG"
            echo "rg_location=$LOCATION"
          } >> "$GITHUB_OUTPUT"

      - name: 9. Live Azure ARM Template Validation
        run: |
          SUB_ID="${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}"
          if [ -n "$SUB_ID" ]; then
            az account set --subscription "$SUB_ID"
          fi
          RG="${{ steps.ensure-rg.outputs.rg_name }}"
          LOCATION="${{ steps.ensure-rg.outputs.rg_location }}"
          echo "Running live Azure Resource Manager pre-flight validation on '$RG'..."
          az deployment group validate \
            --resource-group "$RG" \
            --template-file ./infra/infra.bicep \
            --parameters \
              environment="${{ inputs.environment }}" \
              location="$LOCATION" \
              fileShareQuotaGb=${{ inputs.fileShareQuotaGb }} \
              acrName="${{ inputs.acrName }}" \
            --output table
          echo "✅ Live Azure ARM Pre-Flight Validation Succeeded: 0 template or quota violations."

      - name: 10. Publish Stage 1 Validation Summary
        if: always()
        run: |
          {
            echo "## 🔍 Stage 1: Validation Results"
            echo "| Check | Result |"
            echo "| :--- | :--- |"
            echo "| **Aspire AppHost Model** | ✅ Validated |"
            echo "| **Bicep IaC Compilation** | ✅ Validated (\`infra.bicep\` & \`app.bicep\`) |"
            echo "| **Gitleaks Secret Scan** | ✅ 0 Secrets Detected |"
            echo "| **Live ARM API Validation** | ✅ Pre-Flight Schema & Quota Passed |"
            echo "| **Target Resource Group** | \`${{ steps.ensure-rg.outputs.rg_name }}\` (\`${{ steps.ensure-rg.outputs.rg_location }}\`) |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # STAGE 2: PREVIEW (ARM What-If Change Detection)
  # ============================================================================
  preview-infrastructure:
    name: 'Stage 2: Preview (ARM What-If Analysis)'
    needs: [validate-infrastructure]
    if: github.actor == 'nikunjbanker'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 2. Azure CLI Authentication (OIDC / Federated Credentials)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/login@d19a4f1b3c068b799dff7574ac265b0144f415fe # v2.2.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: '2b. Azure CLI Authentication (Fallback: Service Principal JSON)'
        if: ${{ env.AZURE_CLIENT_ID == '' }}
        uses: azure/login@d19a4f1b3c068b799dff7574ac265b0144f415fe # v2.2.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 3. Azure ARM What-If Resource Change Detection
        id: whatif
        run: |
          SUB_ID="${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}"
          if [ -n "$SUB_ID" ]; then
            echo "Setting Azure subscription context to '$SUB_ID'..."
            az account set --subscription "$SUB_ID"
          fi
          RG="${{ needs.validate-infrastructure.outputs.rg_name || inputs.resourceGroupName || vars.AZURE_RESOURCE_GROUP || 'rg-dietdost-dev' }}"
          LOCATION="${{ needs.validate-infrastructure.outputs.rg_location || inputs.location || vars.AZURE_LOCATION || 'centralindia' }}"

          echo "=========================================================="
          echo "Executing Azure ARM What-If Analysis for '$RG' in '$LOCATION'..."
          echo "=========================================================="

          az deployment group what-if \
            --resource-group "$RG" \
            --template-file ./infra/infra.bicep \
            --parameters \
              environment="${{ inputs.environment }}" \
              location="$LOCATION" \
              fileShareQuotaGb=${{ inputs.fileShareQuotaGb }} \
              acrName="${{ inputs.acrName }}" \
            --result-format ResourceIdOnly > whatif_summary.txt || true

          cat whatif_summary.txt

      - name: 4. Publish Stage 2 What-If Preview Matrix
        if: always()
        run: |
          RG="${{ needs.validate-infrastructure.outputs.rg_name || inputs.resourceGroupName || vars.AZURE_RESOURCE_GROUP || 'rg-dietdost-dev' }}"
          {
            echo "## 📋 Stage 2: Infrastructure Preview (What-If Analysis)"
            echo "Target Resource Group: \`$RG\` (\`${{ inputs.environment }}\`)"
            echo ""
            echo "<details open><summary><strong>Planned Cloud Infrastructure Mutations</strong></summary>"
            echo ""
            echo "\`\`\`text"
            if [ -f whatif_summary.txt ]; then
              cat whatif_summary.txt
            else
              echo "No what-if output captured."
            fi
            echo "\`\`\`"
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # STAGE 3: PROVISION (Deploy Cloud Infrastructure via Bicep)
  # ============================================================================
  provision-infrastructure:
    name: 'Stage 3: Provision (Deploy Infrastructure via Bicep)'
    needs: [preview-infrastructure, validate-infrastructure]
    if: github.actor == 'nikunjbanker'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 2. Azure CLI Authentication (OIDC / Federated Credentials)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/login@d19a4f1b3c068b799dff7574ac265b0144f415fe # v2.2.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: '2b. Azure CLI Authentication (Fallback: Service Principal JSON)'
        if: ${{ env.AZURE_CLIENT_ID == '' }}
        uses: azure/login@d19a4f1b3c068b799dff7574ac265b0144f415fe # v2.2.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 3. Set Azure Subscription Context
        run: |
          SUB_ID="${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}"
          if [ -n "$SUB_ID" ]; then
            echo "Setting Azure subscription context to '$SUB_ID'..."
            az account set --subscription "$SUB_ID"
          fi

      - name: 4. Provision Cloud Infrastructure via Bicep
        id: deploy-infra
        uses: Azure/arm-deploy@a1361c2c2cd398621955b16ca32e01c65ea340f5 # v2.0.0
        with:
          subscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ needs.validate-infrastructure.outputs.rg_name || inputs.resourceGroupName || vars.AZURE_RESOURCE_GROUP || 'rg-dietdost-dev' }}
          template: ./infra/infra.bicep
          parameters: >-
            environment=${{ inputs.environment }}
            location=${{ needs.validate-infrastructure.outputs.rg_location || inputs.location || vars.AZURE_LOCATION || 'centralindia' }}
            fileShareQuotaGb=${{ inputs.fileShareQuotaGb }}
            acrName=${{ inputs.acrName }}
          failOnStderr: false

      - name: 5. Verify & Output Infrastructure Endpoints
        run: |
          echo "=========================================================="
          echo "  ASPIRE CLOUD INFRASTRUCTURE PROVISIONING COMPLETE       "
          echo "=========================================================="
          echo "Resource Group:   ${{ needs.validate-infrastructure.outputs.rg_name || inputs.resourceGroupName }}"
          echo "Region/Location:  ${{ needs.validate-infrastructure.outputs.rg_location || inputs.location }}"
          echo "ACR Name:         ${{ steps.deploy-infra.outputs.acrName }}"
          echo "ACR Login Server: ${{ steps.deploy-infra.outputs.acrLoginServer }}"
          echo "ACA Environment:  ${{ steps.deploy-infra.outputs.acaEnvironmentName }}"
          echo "Storage Account:  ${{ steps.deploy-infra.outputs.storageAccountName }}"
          echo "SMB File Share:   ${{ steps.deploy-infra.outputs.fileShareName }}"
          echo "Storage Mount:    ${{ steps.deploy-infra.outputs.storageMountName }}"
          echo "Static IP:        ${{ steps.deploy-infra.outputs.staticIp }}"
          echo "Custom Domain ID: ${{ steps.deploy-infra.outputs.customDomainVerificationId }}"
          echo "Key Vault Name:   ${{ steps.deploy-infra.outputs.keyVaultName }}"
          echo "Key Vault URI:    ${{ steps.deploy-infra.outputs.keyVaultUri }}"
          echo "Managed Identity: ${{ steps.deploy-infra.outputs.managedIdentityId }}"
          echo "=========================================================="

      - name: 6. Publish Stage 3 Provisioning Completion Summary
        if: always()
        run: |
          {
            echo "## 🚀 Stage 3: Infrastructure Provisioning Complete"
            echo "| Dimension | Provisioned Value |"
            echo "| :--- | :--- |"
            echo "| **Resource Group** | \`${{ needs.validate-infrastructure.outputs.rg_name || inputs.resourceGroupName }}\` |"
            echo "| **Region / Location** | \`${{ needs.validate-infrastructure.outputs.rg_location || inputs.location }}\` |"
            echo "| **ACA Environment** | \`${{ steps.deploy-infra.outputs.acaEnvironmentName }}\` |"
            echo "| **Storage Account** | \`${{ steps.deploy-infra.outputs.storageAccountName }}\` |"
            echo "| **SMB File Share** | \`${{ steps.deploy-infra.outputs.fileShareName }}\` |"
            echo "| **Storage Mount** | \`${{ steps.deploy-infra.outputs.storageMountName }}\` |"
            echo "| **Container Registry** | \`${{ steps.deploy-infra.outputs.acrName }}\` (\`${{ steps.deploy-infra.outputs.acrLoginServer }}\`) |"
            echo "| **Key Vault Name** | \`${{ steps.deploy-infra.outputs.keyVaultName }}\` |"
            echo "| **Key Vault URI** | \`${{ steps.deploy-infra.outputs.keyVaultUri }}\` |"
            echo "| **Managed Identity** | \`${{ steps.deploy-infra.outputs.managedIdentityId }}\` |"
            echo "| **Static Ingress IP** | \`${{ steps.deploy-infra.outputs.staticIp }}\` |"
            echo "| **Custom Domain Verification ID** | \`${{ steps.deploy-infra.outputs.customDomainVerificationId }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
