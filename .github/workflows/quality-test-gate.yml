# GitHub Actions: Quality & Multi-Tier Test Gate Pipeline
# Multi-tiered verification matrix enforcing quality gates before deployment:
# Strict Supply Chain Security: All actions pinned to immutable commit SHAs.
# 1. Tier 1: Domain & Clinical Nutrition Unit Tests (ICMR-NIN 2024, Clinical Math) : Gate >= 44% Line Coverage
# 2. Tier 2: Subsystem & BFF Integration Tests (CQRS Dispatcher, BFF, Auth)      : Gate >= 40% Line Coverage
# 3. Tier 3: Subsystem Contracts & Design System Tests (Wiring, Caching, Tokens) : Gate >= 75%
# 4. Tier 4: Multi-Tier User Acceptance & E2E CFT Suite (5-Tier CFT, Paywalls)    : Gate >= 70%
# 5. Quality Gate Summary: Aggregated verdict posted as PR comment
# ==============================================================================

name: Quality & Multi-Tier Test Gate Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

env:
  UNIT_TEST_THRESHOLD: 44
  INTEGRATION_TEST_THRESHOLD: 40
  SYSTEM_TEST_THRESHOLD: 75
  E2E_TEST_THRESHOLD: 70

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Tier 1: Domain & Clinical Nutrition Unit Tests (Threshold: >= 44% Line Coverage, 0 failures)
  # ----------------------------------------------------------------------------
  unit-tests:
    name: "Tier 1: Domain & Clinical Nutrition Unit Tests (44% Coverage Quality Gate)"
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 2. Setup .NET 11 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '11.0.x'

      - name: 3. Restore & Build Solution
        run: dotnet build tests/Nutrition.Domain.Tests/Nutrition.Domain.Tests.csproj -c Release

      - name: 4. Execute Unit Tests with Code Coverage via Quality Test Gate
        shell: pwsh
        run: |
          pwsh -File scripts/verify-quality-test-gates.ps1 -Tier Unit -Configuration Release

  # ----------------------------------------------------------------------------
  # Job 2: Tier 2: Subsystem & BFF Integration Tests (Threshold: >= 40% Line Coverage, 0 failures)
  # ----------------------------------------------------------------------------
  integration-tests:
    name: "Tier 2: Subsystem & BFF Integration Tests (40% Coverage Quality Gate)"
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 2. Setup .NET 11 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '11.0.x'

      - name: 3. Restore & Build Eval Harness
        run: dotnet build tests/Nutrition.EvalHarness.Tests/Nutrition.EvalHarness.Tests.csproj -c Release

      - name: 4. Execute Integration Tests with Code Coverage via Quality Test Gate
        shell: pwsh
        run: |
          pwsh -File scripts/verify-quality-test-gates.ps1 -Tier Integration -Configuration Release

  # ----------------------------------------------------------------------------
  # Job 3: Tier 3: Subsystem Contracts & Design System Tests (Threshold: >= 75%)
  # ----------------------------------------------------------------------------
  system-tests:
    name: "Tier 3: Subsystem Contracts & Design System Tests (75% Quality Gate)"
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 2. Setup .NET 11 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '11.0.x'

      - name: 3. Setup Node.js 22 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: 4. Build WebGateway Project
        run: dotnet build src/Nutrition.WebGateway/Nutrition.WebGateway.csproj -c Debug

      - name: 5. Execute System Test Suites via Quality Test Gate
        shell: pwsh
        env:
          CHROME_PATH: /usr/bin/google-chrome
          BASE_URL: http://127.0.0.1:5240
          ASPNETCORE_ENVIRONMENT: Development
          DOTNET_ENVIRONMENT: Development
        run: |
          pwsh -File scripts/verify-quality-test-gates.ps1 -Tier System -BaseUrl "http://127.0.0.1:5240"

  # ----------------------------------------------------------------------------
  # Job 4: Tier 4: Multi-Tier User Acceptance & E2E CFT Suite (Threshold: >= 70%)
  # ----------------------------------------------------------------------------
  e2e-tests:
    name: "Tier 4: Multi-Tier User Acceptance & E2E CFT Suite (70% Quality Gate)"
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 2. Setup .NET 11 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '11.0.x'

      - name: 3. Setup Node.js 22 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: 4. Build WebGateway Project
        run: dotnet build src/Nutrition.WebGateway/Nutrition.WebGateway.csproj -c Debug

      - name: 5. Execute Multi-Tier E2E Acceptance Suites via Quality Test Gate
        shell: pwsh
        env:
          CHROME_PATH: /usr/bin/google-chrome
          BASE_URL: http://127.0.0.1:5240
          ASPNETCORE_ENVIRONMENT: Development
          DOTNET_ENVIRONMENT: Development
        run: |
          pwsh -File scripts/verify-quality-test-gates.ps1 -Tier E2E -BaseUrl "http://127.0.0.1:5240"

  # ----------------------------------------------------------------------------
  # Job 5: Quality Gate Summary & Enforcement
  # ----------------------------------------------------------------------------
  quality-gate-summary:
    name: Quality Gate Summary & PR Verdict
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, system-tests, e2e-tests]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Compile Quality Gate Summary & Console Log
        run: |
          echo "=========================================================="
          echo "      QUALITY & MULTI-TIER TEST GATE SUMMARY VERDICT      "
          echo "=========================================================="
          echo "Tier 1: Domain & Clinical Nutrition Unit Tests (Line Coverage >= 44%)        : ${{ needs.unit-tests.result }}"
          echo "Tier 2: Subsystem & BFF Integration Tests (Line Coverage >= 40%)             : ${{ needs.integration-tests.result }}"
          echo "Tier 3: Subsystem Contracts & Design System Tests (Pass Rate >= 75%)         : ${{ needs.system-tests.result }}"
          echo "Tier 4: Multi-Tier User Acceptance & E2E CFT Suite (Pass Rate >= 70%)        : ${{ needs.e2e-tests.result }}"
          echo "=========================================================="

          if [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ] || \
             [ "${{ needs.system-tests.result }}" != "success" ] || \
             [ "${{ needs.e2e-tests.result }}" != "success" ]; then
            echo "❌ CRITICAL QUALITY GATE FAILURE: One or more test tiers failed or fell below threshold."
            echo "FINAL_EXIT_CODE=1" >> "$GITHUB_ENV"
          else
            echo "✅ ALL QUALITY & TEST GATES PASSED: Solution certified for deployment under all 4 tiers."
            echo "FINAL_EXIT_CODE=0" >> "$GITHUB_ENV"
          fi

      - name: Publish Quality Gate Summary as PR Comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cat << 'EOF' > pr_quality_summary.md
          ### 🧪 Quality & Multi-Tier Test Gate Summary

          | Test Tier | Target Scope & Subsystems | Required Threshold | Achieved Verdict |
          | :--- | :--- | :--- | :--- |
          | **Tier 1: Domain & Clinical Nutrition Unit Tests** | Domain Math, ICMR-NIN 2024, Clinical Calculators | `Line Coverage >= 44% (0 failures)` | ${{ needs.unit-tests.result == 'success' && '🟢 PASS' || '🔴 FAIL' }} |
          | **Tier 2: Subsystem & BFF Integration Tests** | CQRS Native Dispatcher, Web BFF Composite, Mobile BFF, Auth | `Line Coverage >= 40% (0 failures)` | ${{ needs.integration-tests.result == 'success' && '🟢 PASS' || '🔴 FAIL' }} |
          | **Tier 3: Subsystem Contracts & Design System Tests** | Subsystem Wiring, Mobile BFF ETag Caching, Design Tokens | `Pass Rate >= 75%` | ${{ needs.system-tests.result == 'success' && '🟢 PASS' || '🔴 FAIL' }} |
          | **Tier 4: Multi-Tier User Acceptance & E2E CFT Suite** | 5-Tier User Journeys, AI Quota Gating, Paywalls, SuperAdmin | `Pass Rate >= 70%` | ${{ needs.e2e-tests.result == 'success' && '🟢 PASS' || '🔴 FAIL' }} |

          > **Commit SHA**: `${{ github.sha }}`  
          > **Overall Quality Verdict**: ${{ (needs.unit-tests.result == 'success' && needs.integration-tests.result == 'success' && needs.system-tests.result == 'success' && needs.e2e-tests.result == 'success') && '✅ **ALL QUALITY GATES PASSED: CERTIFIED FOR DEPLOYMENT**' || '❌ **CRITICAL QUALITY GATE FAILURE: DEPLOYMENT BLOCKED**' }}  
          EOF

          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file pr_quality_summary.md

      - name: Enforce Final Quality Gate Exit Code
        run: |
          if [ "${FINAL_EXIT_CODE}" -ne 0 ]; then
            exit 1
          fi
