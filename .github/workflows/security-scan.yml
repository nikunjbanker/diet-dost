# ==============================================================================
# GitHub Actions: Unified Security & Code Scanning Pipeline
# Multi-layered DevSecOps static analysis matrix executing in parallel.
# Strict Supply Chain Security: All actions pinned to immutable commit SHAs.
# 1. Gitleaks: Secrets & credential leak detection (SARIF)
# 2. ESLint: Client-side JavaScript static code analysis (SARIF)
# 3. SecurityCodeScan: .NET / C# SAST vulnerability analysis (SARIF)
# 4. Trivy: Dependencies, filesystem & container CVE scanner (SARIF)
# 5. Checkov: Infrastructure-as-Code (Bicep/ARM) security policy scanner (SARIF)
# 6. actionlint: GitHub Actions workflow security & shell injection linter
# 7. AI Security Defense: OWASP Top 10 LLM, Slopsquatting & AI Best Practices
# 8. Security Gate Summary: Aggregated verdict posted as PR comment
# ==============================================================================

name: Security & Code Scanning Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
  schedule:
    - cron: '30 18 * * 5' # Weekly Friday security sweep
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Gitleaks - Secret & Credential Leak Scanning
  # ----------------------------------------------------------------------------
  gitleaks:
    name: Gitleaks (Secret Scanning)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (Full history required for commit scanning)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Gitleaks CLI
        run: |
          GITLEAKS_VERSION="8.18.4"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          rm -f gitleaks.tar.gz
          gitleaks version

      - name: Execute Gitleaks Scan
        run: |
          gitleaks detect --source . --verbose --report-format sarif --report-path gitleaks.sarif --redact
        continue-on-error: true

      - name: Upload Gitleaks SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@cf12ceefebab2c867b9c35d7f907e059681d37ab # v3.26.11
        if: always()
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # ----------------------------------------------------------------------------
  # Job 2: ESLint - Client-Side JavaScript Static Analysis
  # ----------------------------------------------------------------------------
  eslint:
    name: ESLint (Client JS SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install ESLint & SARIF Formatter
        run: |
          npm install eslint@8.57.0 @microsoft/eslint-formatter-sarif@3.1.0

      - name: Run ESLint
        env:
          SARIF_ESLINT_IGNORE_SUPPRESSED: "true"
        run: |
          npx eslint . \
            --config .eslintrc.js \
            --ext .js,.jsx,.ts,.tsx,.mjs \
            --format @microsoft/eslint-formatter-sarif \
            --output-file eslint-results.sarif \
            --no-error-on-unmatched-pattern
        continue-on-error: true

      - name: Upload ESLint SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@cf12ceefebab2c867b9c35d7f907e059681d37ab # v3.26.11
        if: always()
        with:
          sarif_file: eslint-results.sarif
          category: eslint

  # ----------------------------------------------------------------------------
  # Job 3: SecurityCodeScan - .NET / C# SAST Vulnerability Analysis
  # ----------------------------------------------------------------------------
  securitycodescan:
    name: SecurityCodeScan (.NET C# SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@87b7050bc53ea08284295505d98d2aa94301e852 # v4.2.0
        with:
          dotnet-version: '11.0.x'

      - name: Install security-scan tool
        run: dotnet tool install --global security-scan || true

      - name: Execute SecurityCodeScan Analysis (All Projects)
        run: |
          mkdir -p sarif-results
          for proj in $(find src tests -name "*.csproj"); do
            proj_name=$(basename "$proj" .csproj)
            echo "--> Scanning project: $proj"
            security-scan "$proj" --export="sarif-results/${proj_name}.sarif" || true
          done

          python3 -c '
          import json, glob, sys
          merged_runs = []
          for file in glob.glob("sarif-results/*.sarif"):
              try:
                  with open(file, "r", encoding="utf-8") as f:
                      data = json.load(f)
                      merged_runs.extend(data.get("runs", []))
              except Exception as e:
                  print(f"Warning reading {file}: {e}", file=sys.stderr)

          if not merged_runs:
              merged_runs = [{
                  "tool": {"driver": {"name": "SecurityCodeScan", "version": "5.6.7"}},
                  "results": []
              }]

          sarif_doc = {
              "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
              "version": "2.1.0",
              "runs": merged_runs
          }

          with open("security-code-scan.sarif", "w", encoding="utf-8") as f:
              json.dump(sarif_doc, f, indent=2)

          print(f"Aggregated {len(merged_runs)} SARIF run(s) across all projects into security-code-scan.sarif")
          '

      - name: Upload SecurityCodeScan SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@cf12ceefebab2c867b9c35d7f907e059681d37ab # v3.26.11
        if: always()
        with:
          sarif_file: security-code-scan.sarif
          category: securitycodescan

  # ----------------------------------------------------------------------------
  # Job 4: Trivy - Dependency, Filesystem & Container CVE Scanner
  # ----------------------------------------------------------------------------
  trivy:
    name: Trivy (Dependency & IaC Scanner)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Trivy CLI
        run: |
          TRIVY_VERSION="0.56.2"
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o trivy.tar.gz
          tar -xzf trivy.tar.gz trivy
          sudo mv trivy /usr/local/bin/
          rm -f trivy.tar.gz
          trivy --version

      - name: Run Trivy Scanner
        run: |
          trivy fs --format sarif --output trivy-results.sarif --severity CRITICAL,HIGH --ignore-unfixed . || true
          if [ ! -f trivy-results.sarif ]; then
            echo '{"$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"Trivy","version":"0.56.2"}},"results":[]}]}' > trivy-results.sarif
          fi

      - name: Upload Trivy SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@cf12ceefebab2c867b9c35d7f907e059681d37ab # v3.26.11
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # ----------------------------------------------------------------------------
  # Job 5: Checkov - Infrastructure-as-Code (Bicep / Cloud Policies)
  # ----------------------------------------------------------------------------
  checkov:
    name: Checkov (IaC Bicep Security)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Checkov Scanner
        uses: bridgecrewio/checkov-action@b406dfe80a3d33640d5b5deb4341f2475cc016a0 # v12.2812.0
        with:
          directory: infra
          framework: bicep,arm
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: true

      - name: Upload Checkov SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@cf12ceefebab2c867b9c35d7f907e059681d37ab # v3.26.11
        if: always()
        with:
          sarif_file: checkov.sarif
          category: checkov

  # ----------------------------------------------------------------------------
  # Job 6: actionlint - GitHub Actions Workflow Security & Linter
  # ----------------------------------------------------------------------------
  actionlint:
    name: actionlint (Workflow Security)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install actionlint
        run: |
          ACTIONLINT_VERSION="1.7.7"
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o actionlint.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/
          rm -f actionlint.tar.gz
          actionlint -version

      - name: Run actionlint
        run: |
          actionlint -color

  # ----------------------------------------------------------------------------
  # Job 7: AI Security Defense - OWASP LLM, Slopsquatting & Best Practices
  # ----------------------------------------------------------------------------
  ai-security-defense:
    name: AI Security Defense (OWASP LLM & Slopsquatting)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Execute AI Security Defense Validator
        shell: pwsh
        run: |
          pwsh -File scripts/verify-ai-security-defense.ps1 -Mode All

  # ----------------------------------------------------------------------------
  # Job 8: Aggregating Security Gate Summary & PR Comment Publisher
  # ----------------------------------------------------------------------------
  security-gate-summary:
    name: Security Gate Summary
    runs-on: ubuntu-latest
    needs: [gitleaks, eslint, securitycodescan, trivy, checkov, actionlint, ai-security-defense]
    if: always()
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: write
    steps:
      - name: Checkout code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Compile Security Verdict & Console Log
        run: |
          echo "=========================================================="
          echo "         SECURITY & CODE SCANNING GATE VERDICT           "
          echo "=========================================================="
          echo "Gitleaks (Secrets)      : ${{ needs.gitleaks.result }}"
          echo "ESLint (JavaScript)     : ${{ needs.eslint.result }}"
          echo "SecurityCodeScan (.NET) : ${{ needs.securitycodescan.result }}"
          echo "Trivy (Vulnerabilities) : ${{ needs.trivy.result }}"
          echo "Checkov (IaC / Bicep)   : ${{ needs.checkov.result }}"
          echo "actionlint (Workflows)  : ${{ needs.actionlint.result }}"
          echo "AI Security Defense     : ${{ needs.ai-security-defense.result }}"
          echo "=========================================================="
          
          if [ "${{ needs.gitleaks.result }}" != "success" ] || \
             [ "${{ needs.eslint.result }}" != "success" ] || \
             [ "${{ needs.securitycodescan.result }}" != "success" ] || \
             [ "${{ needs.trivy.result }}" != "success" ] || \
             [ "${{ needs.checkov.result }}" != "success" ] || \
             [ "${{ needs.actionlint.result }}" != "success" ] || \
             [ "${{ needs.ai-security-defense.result }}" != "success" ]; then
            echo "❌ CRITICAL SECURITY GATE FAILURE: One or more security scanners reported issues."
            echo "FINAL_EXIT_CODE=1" >> "$GITHUB_ENV"
          else
            echo "✅ ALL SECURITY GATES PASSED: Solution is clean and certified for deployment."
            echo "FINAL_EXIT_CODE=0" >> "$GITHUB_ENV"
          fi

      - name: Publish Security Gate Summary as PR Comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cat << 'EOF' > pr_security_summary.md
          ### 🛡️ Security & Code Scanning Gate Summary

          | Security Scanner | Target Subsystem / Area | Verdict |
          | :--- | :--- | :--- |
          | **Gitleaks** | Secrets, API Keys & Credential Leak Detection | ${{ needs.gitleaks.result == 'success' && '🟢 PASS' || '🔴 FAIL' }} |
          | **ESLint** | Client-Side JavaScript Static Analysis (SAST) | ${{ needs.eslint.result == 'success' && '🟢 PASS' || '🔴 FAIL' }} |
          | **SecurityCodeScan** | .NET 11 / C# Roslyn SAST Vulnerability Analysis | ${{ needs.securitycodescan.result == 'success' && '🟢 PASS' || '🔴 FAIL' }} |
          | **Trivy** | Filesystem, NuGet Dependencies & Container CVEs | ${{ needs.trivy.result == 'success' && '🟢 PASS' || '🔴 FAIL' }} |
          | **Checkov** | Bicep Infrastructure-as-Code (IaC) Security Policies | ${{ needs.checkov.result == 'success' && '🟢 PASS' || '🔴 FAIL' }} |
          | **actionlint** | GitHub Actions Workflow Security & Shell Injection | ${{ needs.actionlint.result == 'success' && '🟢 PASS' || '🔴 FAIL' }} |
          | **AI Security Defense** | OWASP LLM, Slopsquatting, Insecure Defaults & AI Best Practices | ${{ needs.ai-security-defense.result == 'success' && '🟢 PASS' || '🔴 FAIL' }} |

          > **Commit SHA**: `${{ github.sha }}`  
          > **Status**: ${{ (needs.gitleaks.result == 'success' && needs.eslint.result == 'success' && needs.securitycodescan.result == 'success' && needs.trivy.result == 'success' && needs.checkov.result == 'success' && needs.actionlint.result == 'success' && needs.ai-security-defense.result == 'success') && '✅ **ALL SECURITY GATES PASSED**' || '❌ **SECURITY GATE VIOLATIONS DETECTED**' }}  
          EOF

          gh pr comment "$PR_NUMBER" --body-file pr_security_summary.md

      - name: Enforce Final Gate Exit Code
        run: |
          if [ "${FINAL_EXIT_CODE}" -ne 0 ]; then
            exit 1
          fi

