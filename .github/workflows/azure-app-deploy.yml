# GitHub Actions CI/CD: Aspire Application Build & Deployment Pipeline
# Target: Azure Container Apps Workload Revision + Persistent SQLite SMB Mount
# Driven by: .NET Aspire AppHost & infra/app.bicep
# Strictly On-Demand (workflow_dispatch only) with Mandatory OWASP Pre-Deployment Gates
# ==============================================================================

name: Aspire - Build & Deploy Application

on:
  workflow_dispatch:
    inputs:
      resourceGroupName:
        description: 'Azure Resource Group name (e.g. rg-dietdost-dev)'
        required: false
        type: string
        default: 'rg-dietdost-dev'
      location:
        description: 'Azure region/location (e.g. centralindia)'
        required: false
        type: string
        default: 'centralindia'
      provisionInfra:
        description: 'Ensure / provision required cloud infrastructure before deploying app'
        required: false
        type: boolean
        default: true
      allowDemoUsers:
        description: 'Enable seeded 5-tier demo accounts for dev showcase'
        required: false
        type: boolean
        default: true
      enableCustomDomain:
        description: 'Enable custom domain binding (dev.diet-dost.in)'
        required: false
        type: boolean
        default: false
      environment:
        description: 'Target environment name (e.g. dev, prod)'
        required: false
        type: string
        default: 'dev'

permissions:
  id-token: write
  contents: read
  security-events: write
  actions: read

jobs:
  pre-deployment-security-scan:
    name: Mandatory Pre-Deployment Security Gates
    uses: ./.github/workflows/security-scan.yml
    secrets: inherit

  build-test-and-deploy:
    name: Aspire Application Build, Security Gate & Deploy
    needs: pre-deployment-security-scan
    if: github.actor == 'nikunjbanker'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 2. Setup .NET 11 SDK
        uses: actions/setup-dotnet@87b7050bc53ea08284295505d98d2aa94301e852 # v4.2.0
        with:
          dotnet-version: '11.0.x'

      - name: 3. Install / Verify Aspire CLI
        run: |
          echo "Installing or updating Aspire CLI..."
          dotnet tool install -g aspire.cli || dotnet tool update -g aspire.cli
          aspire --version

      - name: 4. OWASP Security Gate - Audit NuGet Dependencies (OWASP A06)
        run: |
          echo "Scanning all package dependencies for known CVE vulnerabilities..."
          AUDIT_LOG=$(dotnet list package --vulnerable --include-transitive)
          echo "$AUDIT_LOG"
          if echo "$AUDIT_LOG" | grep -iq "has the following vulnerable packages"; then
            echo "❌ CRITICAL OWASP SECURITY GATE FAILED: Vulnerable dependencies detected in solution!"
            echo "Deployment denied by release governance policy."
            exit 1
          fi
          echo "✅ OWASP Dependency Security Gate Passed: 0 known vulnerabilities found."

      - name: 4b. Pre-Deployment Security Gate - Secret Leak Scan (Gitleaks)
        run: |
          echo "Scanning workspace for accidental secret or credential leaks..."
          GITLEAKS_VERSION="8.30.1"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          rm -f gitleaks.tar.gz
          gitleaks detect --source . --verbose --no-git --redact
          echo "✅ Pre-Deployment Secret Gate Passed: 0 secrets detected."

      - name: 4c. Pre-Deployment Security Gate - Client Code Static Analysis (ESLint)
        run: |
          echo "Validating client-side JavaScript assets with ESLint..."
          npm install eslint@9.20.0
          npx eslint .
          echo "✅ Pre-Deployment ESLint Gate Passed: 0 code quality violations."

      - name: 4d. Pre-Deployment Security Gate - Bicep IaC Schema & Compilation Validation
        run: |
          echo "Validating Bicep cloud infrastructure templates..."
          az bicep build --file infra/infra.bicep
          az bicep build --file infra/app.bicep
          echo "✅ Pre-Deployment Bicep IaC Gate Passed: Templates compiled successfully."

      - name: 5. Execute Full Security & Functional Test Suites (100% Pass Standard)
        run: |
          echo "Running 170+ unit, domain, and security gating test suites..."
          dotnet test --configuration Release --verbosity normal

      - name: 6. Aspire Publish - Validate AppHost Model & Generate Manifests
        run: |
          echo "Evaluating Aspire AppHost deployment pipeline steps..."
          aspire publish --apphost src/Nutrition.AppHost --output-path ./aspire-output --non-interactive
          echo "✅ Aspire application pipeline steps validated."

      - name: 7. Azure CLI Authentication (OIDC / Federated Credentials)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/login@d19a4f1b3c068b799dff7574ac265b0144f415fe # v2.2.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: '7b. Azure CLI Authentication (Fallback: Service Principal JSON)'
        if: ${{ env.AZURE_CLIENT_ID == '' }}
        uses: azure/login@d19a4f1b3c068b799dff7574ac265b0144f415fe # v2.2.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 8. Ensure Azure Resource Group Exists (Create if Missing)
        if: ${{ inputs.provisionInfra != false }}
        id: ensure-rg
        run: |
          SUB_ID="${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}"
          if [ -n "$SUB_ID" ]; then
            echo "Setting Azure subscription context to '$SUB_ID'..."
            az account set --subscription "$SUB_ID"
          fi
          RG="${{ inputs.resourceGroupName || vars.AZURE_RESOURCE_GROUP || 'rg-dietdost-dev' }}"
          LOCATION="${{ inputs.location || vars.AZURE_LOCATION || 'centralindia' }}"
          echo "=========================================================="
          echo "Checking if Azure Resource Group '$RG' exists in '$LOCATION'..."
          echo "=========================================================="
          if az group exists --name "$RG"; then
            echo "✅ Resource Group '$RG' already exists."
          else
            echo "⚡ Resource Group '$RG' does not exist. Creating now in '$LOCATION'..."
            az group create \
              --name "$RG" \
              --location "$LOCATION" \
              --tags environment="${{ inputs.environment }}" project="diet-dost" managed-by="aspire" \
              --output table
            echo "✅ Created Resource Group '$RG'."
          fi
          {
            echo "rg_name=$RG"
            echo "rg_location=$LOCATION"
          } >> "$GITHUB_OUTPUT"

      - name: 9. Ensure & Provision Required Cloud Infrastructure (Aspire Foundation)
        if: ${{ inputs.provisionInfra != false }}
        id: deploy-infra
        uses: Azure/arm-deploy@a1361c2c2cd398621955b16ca32e01c65ea340f5 # v2.0.0
        with:
          subscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ steps.ensure-rg.outputs.rg_name || inputs.resourceGroupName || vars.AZURE_RESOURCE_GROUP || 'rg-dietdost-dev' }}
          template: ./infra/infra.bicep
          parameters: >-
            environment=${{ inputs.environment }}
            location=${{ steps.ensure-rg.outputs.rg_location || inputs.location || vars.AZURE_LOCATION || 'centralindia' }}
            fileShareQuotaGb=1
          failOnStderr: false

      - name: 10. Resolve ACR & ACA Environment Details
        id: resolve-env
        run: |
          RG="${{ steps.ensure-rg.outputs.rg_name || inputs.resourceGroupName || vars.AZURE_RESOURCE_GROUP || 'rg-dietdost-dev' }}"
          ENV_NAME="cae-dietdost-${{ inputs.environment }}"
          
          # Resolve ACR Name
          ACR_NAME="${{ secrets.ACR_NAME }}"
          if [ -z "$ACR_NAME" ]; then
            ACR_NAME="${{ steps.deploy-infra.outputs.acrName }}"
          fi
          if [ -z "$ACR_NAME" ]; then
            ACR_NAME=$(az acr list --resource-group "$RG" --query "[0].name" -o tsv)
          fi
          
          if [ -z "$ACR_NAME" ]; then
            echo "❌ ACR not found in '$RG'!"
            exit 1
          fi
          
          # Resolve ACA Environment ID
          ACA_ENV_ID="${{ steps.deploy-infra.outputs.acaEnvironmentId }}"
          if [ -z "$ACA_ENV_ID" ]; then
            echo "Resolving ACA Managed Environment '$ENV_NAME' from Azure CLI..."
            ACA_ENV_ID=$(az containerapp env show \
              --name "$ENV_NAME" \
              --resource-group "$RG" \
              --query "id" -o tsv)
          fi
          
          if [ -z "$ACA_ENV_ID" ]; then
            echo "❌ ACA Environment '$ENV_NAME' not found in '$RG'!"
            echo "Please set 'provisionInfra: true' or run the 'Aspire - Provision Azure Infrastructure' workflow first."
            exit 1
          fi
          
          # Resolve Key Vault Name & URI
          KV_NAME="${{ steps.deploy-infra.outputs.keyVaultName }}"
          KV_URI="${{ steps.deploy-infra.outputs.keyVaultUri }}"
          if [ -z "$KV_NAME" ]; then
            KV_NAME=$(az keyvault list --resource-group "$RG" --query "[0].name" -o tsv)
          fi
          if [ -z "$KV_URI" ] && [ -n "$KV_NAME" ]; then
            KV_URI="https://${KV_NAME}.vault.azure.net/"
          fi

          # Resolve User-Assigned Managed Identity
          MI_ID="${{ steps.deploy-infra.outputs.managedIdentityId }}"
          MI_CLIENT_ID="${{ steps.deploy-infra.outputs.managedIdentityClientId }}"
          if [ -z "$MI_ID" ]; then
            MI_ID=$(az identity list --resource-group "$RG" --query "[0].id" -o tsv)
            MI_CLIENT_ID=$(az identity list --resource-group "$RG" --query "[0].clientId" -o tsv)
          fi

          {
            echo "acr_name=$ACR_NAME"
            echo "aca_env_id=$ACA_ENV_ID"
            echo "kv_name=$KV_NAME"
            echo "kv_uri=$KV_URI"
            echo "mi_id=$MI_ID"
            echo "mi_client_id=$MI_CLIENT_ID"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved ACR: $ACR_NAME"
          echo "Resolved ACA Environment ID: $ACA_ENV_ID"
          echo "Resolved Key Vault: $KV_NAME ($KV_URI)"
          echo "Resolved Managed Identity: $MI_ID"

      - name: 10b. Synchronize Configured Secrets to Azure Key Vault (If Provided)
        env:
          KV_NAME: ${{ steps.resolve-env.outputs.kv_name }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
          REQUIRE_MOBILE_VERIFICATION: ${{ secrets.REQUIRE_MOBILE_VERIFICATION }}
        run: |
          if [ -n "$KV_NAME" ]; then
            echo "Checking and synchronizing configured secrets into Azure Key Vault '$KV_NAME'..."
            if [ -n "$JWT_KEY" ]; then
              echo "Setting Jwt--Key in Key Vault..."
              az keyvault secret set --vault-name "$KV_NAME" --name "Jwt--Key" --value "$JWT_KEY" -o none || echo "⚠️ Note: Could not set Jwt--Key (ensure deploy principal has Key Vault Secrets Officer role or populate manually in Azure Portal)"
            fi
            if [ -n "$GEMINI_API_KEY" ]; then
              echo "Setting AI--GoogleAI--ApiKey in Key Vault..."
              az keyvault secret set --vault-name "$KV_NAME" --name "AI--GoogleAI--ApiKey" --value "$GEMINI_API_KEY" -o none || echo "⚠️ Note: Could not set AI--GoogleAI--ApiKey"
            fi
            if [ -n "$AZURE_OPENAI_API_KEY" ]; then
              echo "Setting AI--AzureOpenAI--ApiKey in Key Vault..."
              az keyvault secret set --vault-name "$KV_NAME" --name "AI--AzureOpenAI--ApiKey" --value "$AZURE_OPENAI_API_KEY" -o none || echo "⚠️ Note: Could not set AI--AzureOpenAI--ApiKey"
            fi
            if [ -n "$SUPER_ADMIN_EMAIL" ]; then
              echo "Setting Auth--SuperAdminEmail in Key Vault..."
              az keyvault secret set --vault-name "$KV_NAME" --name "Auth--SuperAdminEmail" --value "$SUPER_ADMIN_EMAIL" -o none || echo "⚠️ Note: Could not set Auth--SuperAdminEmail"
            fi
            if [ -n "$REQUIRE_MOBILE_VERIFICATION" ]; then
              echo "Setting Auth--RequireMobileVerification in Key Vault..."
              az keyvault secret set --vault-name "$KV_NAME" --name "Auth--RequireMobileVerification" --value "$REQUIRE_MOBILE_VERIFICATION" -o none || echo "⚠️ Note: Could not set Auth--RequireMobileVerification"
            fi
            echo "✅ Azure Key Vault secret synchronization step finished."
          fi

      - name: 11. Build OCI Container Image (Podman)
        id: build-image
        run: |
          ACR_NAME="${{ steps.resolve-env.outputs.acr_name }}"
          IMAGE_TAG="${ACR_NAME}.azurecr.io/diet-dost-web:${{ github.sha }}"
          IMAGE_LATEST="${ACR_NAME}.azurecr.io/diet-dost-web:latest"

          # Build container image with Podman
          podman build -t "$IMAGE_TAG" -t "$IMAGE_LATEST" -f Containerfile .
          podman save -o app-image.tar "$IMAGE_TAG"

          {
            echo "image_tag=$IMAGE_TAG"
            echo "image_latest=$IMAGE_LATEST"
          } >> "$GITHUB_OUTPUT"

      - name: 12. OWASP Security Gate - OCI Container Image Vulnerability Scan (Trivy)
        run: |
          echo "Installing Trivy security scanner..."
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /tmp/trivy-bin
          
          echo "Scanning container image for CRITICAL OS and library vulnerabilities..."
          /tmp/trivy-bin/trivy image \
            --input app-image.tar \
            --severity CRITICAL \
            --exit-code 1 \
            --ignore-unfixed

          echo "✅ Container Security Gate Passed: 0 critical unpatched vulnerabilities detected."

      - name: 13. Push OCI Container Image to ACR (Podman)
        run: |
          ACR_NAME="${{ steps.resolve-env.outputs.acr_name }}"
          IMAGE_TAG="${{ steps.build-image.outputs.image_tag }}"
          IMAGE_LATEST="${{ steps.build-image.outputs.image_latest }}"

          # Login to ACR via Azure CLI Entra ID token using Podman (zero admin credentials required)
          ACR_TOKEN=$(az acr login --name "$ACR_NAME" --expose-token --output tsv --query accessToken)
          echo "$ACR_TOKEN" | podman login "${ACR_NAME}.azurecr.io" -u "00000000-0000-0000-0000-000000000000" --password-stdin

          podman push "$IMAGE_TAG"
          podman push "$IMAGE_LATEST"

      - name: 14. Deploy Application Container App via Bicep
        uses: Azure/arm-deploy@a1361c2c2cd398621955b16ca32e01c65ea340f5 # v2.0.0
        with:
          subscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ steps.ensure-rg.outputs.rg_name || inputs.resourceGroupName || vars.AZURE_RESOURCE_GROUP || 'rg-dietdost-dev' }}
          template: ./infra/app.bicep
          parameters: >-
            appName=app-dietdost-web
            acaEnvironmentId=${{ steps.resolve-env.outputs.aca_env_id }}
            containerImage=${{ steps.build-image.outputs.image_tag }}
            customDomain=dev.diet-dost.in
            enableCustomDomain=${{ inputs.enableCustomDomain }}
            allowDemoUsers=${{ inputs.allowDemoUsers }}
            storageMountName=dietdoststorage
            geminiApiKey="${{ secrets.GEMINI_API_KEY }}"
            keyVaultUri=${{ steps.resolve-env.outputs.kv_uri }}
            managedIdentityId=${{ steps.resolve-env.outputs.mi_id }}
            managedIdentityClientId=${{ steps.resolve-env.outputs.mi_client_id }}
          failOnStderr: false

      - name: 15. Verify Application Health & Revision Status
        run: |
          APP_NAME="app-dietdost-web"
          RG="${{ steps.ensure-rg.outputs.rg_name || inputs.resourceGroupName || vars.AZURE_RESOURCE_GROUP || 'rg-dietdost-dev' }}"
          
          echo "Checking Container App revision status..."
          REVISION_HEALTH=$(az containerapp revision list \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "[0].properties.healthState" -o tsv)
          
          echo "Health State: $REVISION_HEALTH"
          
          APP_FQDN=$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          
          echo "=========================================================="
          echo "  DIET-DOST APPLICATION IS LIVE AND VERIFIED!             "
          echo "=========================================================="
          echo "FQDN: https://$APP_FQDN"
          echo "=========================================================="
