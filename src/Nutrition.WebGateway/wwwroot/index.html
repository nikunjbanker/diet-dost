<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Diet Dost | AI-Powered Indian Diet & Calorie Tracker</title>
  <meta name="description" content="South Asian calibrated AI nutrition intelligence adhering to ICMR-NIN guidelines with visual body & face progress tracking.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/diet-dost-icon.svg">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#010102">
  <link rel="stylesheet" href="styles.css?v=1.5.0">
</head>
<body>
  <!-- Application Loading & Splash Screen (Zero CLS) -->
  <div id="app-loading-screen" class="app-splash-screen" aria-label="Loading Diet Dost">
    <div class="splash-card">
      <div class="splash-icon-container">
        <img src="assets/diet-dost-icon.svg" alt="Diet Dost" class="splash-icon-pulse" width="84" height="84">
        <div class="splash-ambient-glow"></div>
      </div>
      <h1 class="splash-title">Diet Dost</h1>
      <p class="splash-subtitle">Your Empathetic AI Nutrition Companion</p>
      <div class="splash-progress-track">
        <div class="splash-progress-indicator"></div>
      </div>
      <div class="splash-status-text" id="splash-status-text">Calibrating ICMR-NIN nutrition models...</div>
    </div>
  </div>

  <!-- Header / Navbar Component -->
  <div data-include="partials/header.html"></div>

  <!-- Main Dashboard Container with Max Width & Centered Margins -->
  <main class="container">
    <!-- Dietitian Companion Avatar & Greeting -->
    <div data-include="partials/companion-card.html"></div>

    <!-- Hero Calorie Balance & Macro HUD -->
    <div data-include="partials/hero-hud.html"></div>

    <!-- Face Transformation & Progress Preview -->
    <div data-include="partials/face-progress-card.html"></div>

    <!-- AI Food Recognition & Smart Logger -->
    <div data-include="partials/meal-logger.html"></div>

    <!-- Historical Calorie & Macro Analytics -->
    <div data-include="partials/analytics-card.html"></div>
  </main>

  <!-- Fixed Thumb-Zone Bottom Navigation Bar (<640px) -->
  <nav class="mobile-bottom-nav" id="mobile-bottom-nav" aria-label="Mobile Navigation">
    <button type="button" class="bottom-nav-item active" id="btn-nav-overview" aria-label="Overview">
      <span class="bottom-nav-icon">📊</span>
      <span class="bottom-nav-label">Overview</span>
    </button>
    <button type="button" class="bottom-nav-item bottom-nav-fab" id="btn-nav-log-meal" aria-label="Log Meal">
      <div class="fab-circle">
        <span class="fab-icon">➕</span>
      </div>
      <span class="bottom-nav-label">Log Meal</span>
    </button>
    <button type="button" class="bottom-nav-item" id="btn-nav-history" aria-label="Meal Diary and History">
      <span class="bottom-nav-icon">📅</span>
      <span class="bottom-nav-label">Diary</span>
    </button>
    <button type="button" class="bottom-nav-item" id="btn-nav-profile" aria-label="Clinical Profile and Intake">
      <span class="bottom-nav-icon">⚙️</span>
      <span class="bottom-nav-label">Clinical</span>
    </button>
  </nav>

  <!-- Interactive Overlays & Modals -->
  <div data-include="partials/auth-gate.html"></div>
  <div data-include="partials/admin-modal.html"></div>
  <div data-include="partials/quota-modal.html"></div>
  <div data-include="partials/review-modal.html"></div>
  <div data-include="partials/profile-modal.html"></div>
  <div data-include="partials/transparency-modal.html"></div>
  <div data-include="partials/progress-modal.html"></div>
  <div data-include="partials/delete-meal-modal.html"></div>

  <!-- Realtime Toast Notifications -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Application Bootstrap (ES Modules, IoC Container & Component Loader) -->
  <script type="module" src="js/main.js?v=1.5.0"></script>
</body>
</html>
