<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d10"/>
      <stop offset="50%" stop-color="#12141a"/>
      <stop offset="100%" stop-color="#181a24"/>
    </linearGradient>
    <radialGradient id="neonGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="rgba(94, 106, 210, 0.18)"/>
      <stop offset="70%" stop-color="rgba(39, 195, 128, 0.05)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="plateRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.16)"/>
      <stop offset="50%" stop-color="rgba(94, 106, 210, 0.4)"/>
      <stop offset="100%" stop-color="rgba(39, 195, 128, 0.25)"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background with Subtle Border -->
  <rect width="100%" height="100%" rx="12" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="398" height="298" rx="11" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <!-- Ambient Glow -->
  <circle cx="200" cy="135" r="110" fill="url(#neonGlow)"/>

  <!-- Left Fork -->
  <g transform="translate(100, 95)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M 0 0 L 0 50 M -6 0 L -6 16 C -6 24 6 24 6 16 L 6 0 M 0 24 L 0 70"/>
  </g>

  <!-- Right Spoon -->
  <g transform="translate(300, 95)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" stroke-linecap="round" fill="none">
    <ellipse cx="0" cy="14" rx="7" ry="12" fill="rgba(255, 255, 255, 0.04)"/>
    <path d="M 0 26 L 0 70"/>
  </g>

  <!-- Indian Thali Plate Graphic -->
  <g transform="translate(200, 135)">
    <!-- Outer Rim -->
    <circle cx="0" cy="0" r="64" fill="#0f1015" stroke="url(#plateRim)" stroke-width="2.5" filter="url(#subtleGlow)"/>
    <!-- Inner Rim -->
    <circle cx="0" cy="0" r="52" fill="#13151d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1.5"/>
    <!-- Decorative Katoris (Bowls) Outline in Thali -->
    <circle cx="-22" cy="-22" r="14" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(94, 106, 210, 0.3)" stroke-width="1.2" stroke-dasharray="2 2"/>
    <circle cx="22" cy="-22" r="14" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(39, 195, 128, 0.3)" stroke-width="1.2" stroke-dasharray="2 2"/>
    <circle cx="0" cy="22" r="16" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.2" stroke-dasharray="2 2"/>
    <!-- Center Food Plate Glyph -->
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" text-anchor="middle" fill="rgba(255, 255, 255, 0.65)">🍲</text>
  </g>

  <!-- Status Pill Badge -->
  <g transform="translate(200, 225)">
    <rect x="-70" y="-12" width="140" height="24" rx="12" fill="rgba(94, 106, 210, 0.12)" stroke="rgba(94, 106, 210, 0.3)" stroke-width="1"/>
    <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#818cf8" letter-spacing="0.5">
      PLATE PREVIEW
    </text>
  </g>

  <!-- Explanatory Caption -->
  <text x="200" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11.5" font-weight="500" text-anchor="middle" fill="rgba(255, 255, 255, 0.45)">
    Image not available or offline
  </text>
</svg>
