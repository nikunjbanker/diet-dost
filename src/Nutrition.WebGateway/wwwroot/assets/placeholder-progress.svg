<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b0e"/>
      <stop offset="50%" stop-color="#101218"/>
      <stop offset="100%" stop-color="#141724"/>
    </linearGradient>
    <radialGradient id="neonGlowP" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.15)"/>
      <stop offset="70%" stop-color="rgba(94, 106, 210, 0.06)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" rx="14" fill="url(#bgGradP)"/>
  <rect x="1" y="1" width="398" height="298" rx="13" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <circle cx="200" cy="125" r="95" fill="url(#neonGlowP)"/>

  <!-- Biometric Scanning Reticle Brackets -->
  <path d="M140 75 H125 V90" stroke="rgba(56, 189, 248, 0.6)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M260 75 H275 V90" stroke="rgba(56, 189, 248, 0.6)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M140 175 H125 V160" stroke="rgba(56, 189, 248, 0.6)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M260 175 H275 V160" stroke="rgba(56, 189, 248, 0.6)" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Futuristic Biometric Silhouette Reticle -->
  <g transform="translate(200, 125)" stroke="rgba(56, 189, 248, 0.75)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="-20" r="22" stroke-width="1.8"/>
    <path d="M-36 30 C-36 8 -14 0 0 0 C14 0 36 8 36 30" stroke-width="1.8"/>
    <!-- Concentric Target Arcs -->
    <circle cx="0" cy="5" r="42" stroke-dasharray="3 4" stroke-width="1.2" opacity="0.4"/>
    <circle cx="0" cy="-20" r="4" fill="rgba(56, 189, 248, 0.8)"/>
  </g>

  <!-- Status Pill Badge -->
  <g transform="translate(200, 210)">
    <rect x="-85" y="-12" width="170" height="24" rx="12" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <text x="0" y="4" font-family="'JetBrains Mono', -apple-system, monospace" font-size="9.5" font-weight="700" text-anchor="middle" fill="#38bdf8" letter-spacing="0.5">
      BIOMETRIC CHECKPOINT
    </text>
  </g>

  <text x="200" y="250" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11.5" font-weight="500" text-anchor="middle" fill="rgba(255, 255, 255, 0.45)">
    Photo checkpoint awaiting capture
  </text>
</svg>
