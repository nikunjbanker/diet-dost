<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d10"/>
      <stop offset="50%" stop-color="#12141a"/>
      <stop offset="100%" stop-color="#181a24"/>
    </linearGradient>
    <radialGradient id="neonGlowP" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="rgba(39, 195, 128, 0.15)"/>
      <stop offset="70%" stop-color="rgba(94, 106, 210, 0.05)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" rx="12" fill="url(#bgGradP)"/>
  <rect x="1" y="1" width="398" height="298" rx="11" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <circle cx="200" cy="130" r="100" fill="url(#neonGlowP)"/>

  <!-- User Contour Silhouette Graphic -->
  <g transform="translate(200, 125)">
    <circle cx="0" cy="-22" r="24" fill="none" stroke="rgba(39, 195, 128, 0.5)" stroke-width="2.5"/>
    <path d="M -38 35 C -38 10 -15 0 0 0 C 15 0 38 10 38 35" fill="none" stroke="rgba(39, 195, 128, 0.5)" stroke-width="2.5" stroke-linecap="round"/>
    <text x="0" y="-14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" text-anchor="middle" fill="rgba(255, 255, 255, 0.7)">👤</text>
  </g>

  <!-- Status Pill Badge -->
  <g transform="translate(200, 215)">
    <rect x="-70" y="-12" width="140" height="24" rx="12" fill="rgba(39, 195, 128, 0.12)" stroke="rgba(39, 195, 128, 0.3)" stroke-width="1"/>
    <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#34d399" letter-spacing="0.5">
      PROGRESS PHOTO
    </text>
  </g>

  <text x="200" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11.5" font-weight="500" text-anchor="middle" fill="rgba(255, 255, 255, 0.45)">
    Photo checkpoint unavailable
