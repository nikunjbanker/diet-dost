<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="100%" height="100%">
  <defs>
    <linearGradient id="faceBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b0e"/>
      <stop offset="50%" stop-color="#101218"/>
      <stop offset="100%" stop-color="#141722"/>
    </linearGradient>
    <radialGradient id="meshGlow1" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.15)"/>
      <stop offset="60%" stop-color="rgba(94, 106, 210, 0.08)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="scanBeam1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="rgba(56, 189, 248, 0.8)"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="320" height="380" rx="16" fill="url(#faceBg1)"/>
  <rect x="1" y="1" width="318" height="378" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Ambient Glow Behind Face -->
  <circle cx="160" cy="150" r="110" fill="url(#meshGlow1)"/>

  <!-- Scanning Corner Reticle Brackets -->
  <path d="M40 70 V45 H65" stroke="rgba(56, 189, 248, 0.6)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M280 70 V45 H255" stroke="rgba(56, 189, 248, 0.6)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M40 240 V265 H65" stroke="rgba(56, 189, 248, 0.6)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M280 240 V265 H255" stroke="rgba(56, 189, 248, 0.6)" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Baseline Biometric Wireframe Face (Fuller Contour, Water Retention) -->
  <g id="biometric-mesh-baseline" stroke="rgba(56, 189, 248, 0.65)" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Full Contour -->
    <path d="M95 130 C90 70, 230 70, 225 130 C225 195, 195 240, 160 246 C125 240, 95 195, 95 130 Z" stroke-width="2"/>
    
    <!-- Forehead & Temple Contours -->
    <path d="M110 95 Q160 85 210 95" stroke-dasharray="2 3"/>
    <path d="M100 120 Q160 110 220 120"/>
    
    <!-- Brow Arches -->
    <path d="M120 125 Q135 120 148 126" stroke-width="1.8"/>
    <path d="M172 126 Q185 120 200 125" stroke-width="1.8"/>
    
    <!-- Orbit / Eye Reticles -->
    <ellipse cx="134" cy="138" rx="12" ry="7"/>
    <circle cx="134" cy="138" r="2.5" fill="rgba(56, 189, 248, 0.8)"/>
    <ellipse cx="186" cy="138" rx="12" ry="7"/>
    <circle cx="186" cy="138" r="2.5" fill="rgba(56, 189, 248, 0.8)"/>
    
    <!-- Bridge & Nose Contour -->
    <path d="M160 125 V175 L150 180 H170 L160 175"/>
    
    <!-- Cheekbone Fullness Arcs (Interstitial Water Retention Lines) -->
    <path d="M105 155 Q135 165 150 180" stroke-dasharray="2 2"/>
    <path d="M215 155 Q185 165 170 180" stroke-dasharray="2 2"/>
    <path d="M110 185 Q135 200 160 205 Q185 200 210 185" stroke="rgba(245, 166, 35, 0.5)"/>
    
    <!-- Baseline Mouth & Chin Contour -->
    <path d="M142 205 Q160 212 178 205" stroke-width="1.6"/>
    <path d="M148 215 Q160 220 172 215"/>
    
    <!-- Vertical Biometric Symmetry Axis -->
    <line x1="160" y1="65" x2="160" y2="255" stroke="rgba(56, 189, 248, 0.25)" stroke-dasharray="3 3"/>
  </g>

  <!-- Horizontal Laser Scan Beam -->
  <line x1="45" y1="150" x2="275" y2="150" stroke="url(#scanBeam1)" stroke-width="1.8"/>

  <!-- Baseline Biometric Telemetry Card -->
  <g transform="translate(20, 290)">
    <rect width="280" height="72" rx="10" fill="rgba(15, 16, 20, 0.9)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    
    <!-- Status Dot & Mode -->
    <circle cx="16" cy="20" r="4" fill="#f5a623"/>
    <text x="28" y="24" fill="#94a3b8" font-family="'JetBrains Mono', -apple-system, monospace" font-size="10.5" font-weight="600" letter-spacing="0.5">
      BASELINE TELEMETRY · DAY 1
    </text>
    
    <!-- Metrics Row 1 -->
    <text x="16" y="44" fill="#f8fafc" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="700">
      Weight: 85.0 kg · Facial Soft Tissue: Elevated
    </text>
    
    <!-- Metrics Row 2 -->
    <text x="16" y="60" fill="#94a3b8" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="10.5">
      Water Retention: High · Mandibular Angle: 128°
    </text>
  </g>
</svg>
