<!-- Obsidian Dark Delete Confirmation Modal -->
<div class="modal-overlay delete-modal-overlay" id="delete-meal-modal" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title" style="display: none;">
  <div class="delete-modal-card">
    <button type="button" class="delete-modal-close-btn" id="btn-close-delete-modal" aria-label="Close modal">
      <svg class="icon-modal-close" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons/sprite.svg#icon-close"></use></svg>
    </button>

    <div class="delete-modal-icon-wrap">
      <div class="delete-modal-icon">
        <svg class="icon-action-delete" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons/sprite.svg#icon-delete"></use></svg>
      </div>
    </div>

    <div class="delete-modal-header">
      <h3 class="delete-modal-title" id="delete-modal-title">Delete Logged Meal?</h3>
      <p class="delete-modal-desc">Are you sure you want to delete this entry from your food diary?</p>
    </div>

    <!-- Dish Preview Card -->
    <div class="delete-meal-preview" id="delete-meal-preview">
      <div class="delete-preview-top">
        <span class="delete-preview-type-badge lunch" id="delete-preview-badge">
          <svg class="icon-meal-type" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons/sprite.svg#icon-meal-lunch"></use></svg>
          <span>Lunch</span>
        </span>
        <span class="delete-preview-time" id="delete-preview-time">Sep 18 · 01:47 PM</span>
      </div>
      <div class="delete-preview-dish" id="delete-preview-dish">North Indian Thali</div>
      <div class="delete-preview-macros" id="delete-preview-macros">
        <span class="macro-mini-pill cals" id="delete-macro-cals"><svg class="icon-svg" width="11" height="11" viewBox="0 0 24 24" aria-hidden="true" style="stroke: #fb923c; margin-right: 3px;"><use href="assets/icons/sprite.svg#icon-fire"></use></svg>471 kcal</span>
        <span class="macro-mini-pill protein" id="delete-macro-protein"><svg class="icon-svg" width="11" height="11" viewBox="0 0 24 24" aria-hidden="true" style="stroke: #f87171; margin-right: 3px;"><use href="assets/icons/sprite.svg#icon-muscle"></use></svg>18.8g P</span>
        <span class="macro-mini-pill carbs" id="delete-macro-carbs"><svg class="icon-svg" width="11" height="11" viewBox="0 0 24 24" aria-hidden="true" style="stroke: #fbbf24; margin-right: 3px;"><use href="assets/icons/sprite.svg#icon-grain"></use></svg>67g C</span>
        <span class="macro-mini-pill fat" id="delete-macro-fat"><svg class="icon-svg" width="11" height="11" viewBox="0 0 24 24" aria-hidden="true" style="stroke: #34d399; margin-right: 3px;"><use href="assets/icons/sprite.svg#icon-lipid"></use></svg>15g F</span>
        <span class="macro-mini-pill fiber" id="delete-macro-fiber"><svg class="icon-svg" width="11" height="11" viewBox="0 0 24 24" aria-hidden="true" style="stroke: #22c55e; margin-right: 3px;"><use href="assets/icons/sprite.svg#icon-leaf"></use></svg>8.2g Fib</span>
        <span class="macro-mini-pill sugar" id="delete-macro-sugar"><svg class="icon-svg" width="11" height="11" viewBox="0 0 24 24" aria-hidden="true" style="stroke: #f472b6; margin-right: 3px;"><use href="assets/icons/sprite.svg#icon-cube"></use></svg>4.1g Sug</span>
      </div>
    </div>

    <!-- Clinical Impact Advisory Box -->
    <div class="delete-advisory-box">
      <span class="advisory-icon"><svg class="icon-svg" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="stroke: #38bdf8;"><use href="assets/icons/sprite.svg#icon-info"></use></svg></span>
      <div class="advisory-text">
        This meal will be permanently removed, and your <strong>daily calorie and macro ledger</strong> will be automatically recalculated.
      </div>
    </div>

    <!-- Actions -->
    <div class="delete-modal-actions">
      <button type="button" class="btn-delete-cancel" id="btn-cancel-delete">Cancel</button>
      <button type="button" class="btn-delete-confirm" id="btn-confirm-delete">
        <svg class="icon-action-delete" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="margin-right: 6px;"><use href="assets/icons/sprite.svg#icon-delete"></use></svg>
        <span class="btn-delete-text">Delete Meal</span>
      </button>
    </div>
  </div>
</div>
