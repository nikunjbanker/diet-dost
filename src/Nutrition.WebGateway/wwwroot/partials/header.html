<!-- Navigation Header Component -->
<header class="app-header">
  <div class="brand-container">
    <div class="brand-badge">
      <img src="assets/diet-dost-icon.svg" class="brand-badge-img" alt="Diet Dost" width="44" height="44">
    </div>
    <div class="brand-name">
      Diet Dost
      <span class="brand-tag">ICMR-NIN & WHO South Asian</span>
    </div>
  </div>
  <div class="header-actions">
    <button id="btn-open-progress-header" class="btn header-btn-desktop" title="Visual Transformation, Face Slimming & Full Body Progress" onclick="openProgressModal('pane-face-progress')">
      🧍 Visual Progress
    </button>
    <button id="btn-open-transparency" class="btn header-btn-desktop" title="View all clinical formulas and one-pager calculation sheet" onclick="openTransparencyModal()">
      📐 Calculation Transparency
    </button>
    <button id="btn-open-profile" class="btn header-btn-desktop" title="View or edit clinical metrics" onclick="openProfileModal()">
      ⚙️ Clinical Intake
    </button>

    <!-- Real-time In-App Notification Bell (SuperAdmin / User Alerts) -->
    <div id="notification-bell-container" class="notification-bell-wrapper" style="position: relative; display: none;">
      <button type="button" id="btn-notification-bell" class="btn btn-outline" style="display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0; position: relative;" title="In-App Notifications">
        <span style="font-size: 1.15rem; line-height: 1;">🔔</span>
        <span id="notification-badge-count" style="display: none; position: absolute; top: -5px; right: -5px; background: #ef4444; color: #ffffff; font-size: 0.65rem; font-weight: 700; border-radius: 9999px; min-width: 18px; height: 18px; line-height: 18px; text-align: center; padding: 0 4px; border: 2px solid #0d1117;">0</span>
      </button>
      <div id="notification-dropdown" class="user-dropdown" style="display: none; width: 340px; right: 0; max-height: 420px; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
        <div style="padding: 10px 14px; border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center;">
          <div style="font-size: 0.85rem; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 6px;">
            <span>🔔</span> Notifications
          </div>
          <button type="button" id="btn-mark-all-read" style="background: none; border: none; color: var(--accent); font-size: 0.72rem; cursor: pointer; text-decoration: underline;">Mark all read</button>
        </div>
        <div id="notification-list" style="padding: 6px 8px;">
          <div style="padding: 18px; text-align: center; font-size: 0.8rem; color: var(--text-muted);">No new notifications</div>
        </div>
      </div>
    </div>

    <!-- User Account & Tier Entitlements Dropdown -->
    <div class="user-menu-wrapper" style="position: relative;">
      <button type="button" id="btn-user-menu" class="btn btn-outline" style="display: flex; align-items: center; gap: 8px; padding: 4px 10px;">
        <span id="header-user-avatar">👤</span>
        <span id="header-user-name" style="font-size: 0.85rem; font-weight: 600;">Account</span>
        <span id="header-tier-pill" class="tier-badge-pill">⚡ Premium</span>
        <span id="ai-quota-badge" class="tier-badge-pill quota-badge" style="font-size: 0.72rem; padding: 2px 8px; background: rgba(56, 189, 248, 0.12); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.25); display: none;">1 scan remaining today</span>
      </button>

      <div id="user-menu-dropdown" class="user-dropdown" style="display: none;">
        <div class="user-dropdown-header">
          <div id="dropdown-user-fullname" style="font-weight: 600; font-size: 0.9rem;">User</div>
          <div id="dropdown-user-email" style="font-size: 0.75rem; color: var(--text-muted); word-break: break-all;">user@domain.com</div>
        </div>
        <div class="user-dropdown-divider"></div>
        <a href="javascript:void(0)" id="menu-open-quota" class="user-dropdown-item">
          <span>📊 AI Quota & Telemetry</span>
          <span id="menu-quota-preview" style="font-size: 0.72rem; color: var(--accent); font-family: monospace;">--</span>
        </a>
        <a href="javascript:void(0)" id="menu-open-admin" class="user-dropdown-item" style="display: none;">
          <span>👑 Admin Governance</span>
        </a>
        <div class="user-dropdown-divider"></div>
        <a href="javascript:void(0)" id="menu-btn-signout" class="user-dropdown-item" style="color: #ff6b6b;">
          <span>🚪 Sign Out</span>
        </a>
      </div>
    </div>
  </div>
</header>
