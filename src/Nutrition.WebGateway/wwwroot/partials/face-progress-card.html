<!-- Face Transformation & Progress Check-In Dashboard Card -->
<section class="card progress-card" id="face-progress-card">
  <div class="progress-card-header">
    <div>
      <div class="hud-title" style="display: flex; align-items: center; gap: 8px;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-brand-hover);" aria-hidden="true">
          <path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M4 16v3a1 1 0 0 0 1 1h3M16 20h3a1 1 0 0 0 1-1v-3"></path>
          <circle cx="12" cy="12" r="3.5"></circle>
          <line x1="12" y1="9" x2="12" y2="15"></line>
        </svg>
        <span>Biometric Face Slimming & Progress</span>
        <span class="progress-delta-pill" id="face-delta-pill">▼ 3.5 kg in 30 Days</span>
      </div>
      <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 2px;">
        Facial slimming & non-scale victory tracking across caloric deficit milestones
      </div>
    </div>
    <div class="progress-header-actions">
      <button type="button" class="btn btn-sm btn-outline" id="btn-open-body-modal" onclick="openProgressModal('pane-body-progress')" style="display: inline-flex; align-items: center; gap: 6px;">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="5" r="2.5"></circle>
          <path d="M8 22v-6l2-2v-4h4v4l2 2v6"></path>
          <path d="M7 11l5-1 5 1"></path>
        </svg>
        <span>DEXA Body & Detail View</span>
      </button>
      <button type="button" class="btn btn-sm btn-primary" id="btn-quick-photo-checkin" onclick="openProgressModal('pane-checkin-upload')" style="display: inline-flex; align-items: center; gap: 6px;">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
        <span>New Check-In</span>
      </button>
    </div>
  </div>

  <div class="face-comparison-grid">
    <!-- Baseline Face Card -->
    <div class="photo-compare-col">
      <div class="compare-badge baseline-badge">Day 1 · Baseline</div>
      <div class="photo-frame" title="Click to inspect photo in high-resolution lightbox">
        <img id="img-baseline-face" src="/uploads/progress/face_baseline.svg" alt="Baseline Face Photo" class="progress-img" onerror="this.onerror=null; this.src='/assets/placeholder-progress.svg';">
      </div>
      <div class="photo-meta-sub">
        <span id="txt-baseline-date" class="meta-date-chip">Day 1 (Aug 16)</span>
        <span id="txt-baseline-weight" class="weight-tag">85.0 kg</span>
      </div>
    </div>

    <!-- VS Divider -->
    <div class="compare-divider">
      <div class="vs-circle">VS</div>
      <div class="days-pill" id="txt-days-elapsed">30 Days</div>
      <div class="delta-sub" id="txt-net-loss">-3.5 kg</div>
    </div>

    <!-- Current Face Card -->
    <div class="photo-compare-col">
      <div class="compare-badge current-badge">Latest Check-In · Day 30</div>
      <div class="photo-frame current-glow" title="Click to inspect photo in high-resolution lightbox">
        <img id="img-current-face" src="/uploads/progress/face_current.svg" alt="Latest Face Photo" class="progress-img" onerror="this.onerror=null; this.src='/assets/placeholder-progress.svg';">
      </div>
      <div class="photo-meta-sub">
        <span id="txt-current-date" class="meta-date-chip">Today (Day 30)</span>
        <span id="txt-current-weight" class="weight-tag emerald-tag">81.5 kg (▼ 3.5 kg)</span>
      </div>
    </div>
  </div>
</section>
