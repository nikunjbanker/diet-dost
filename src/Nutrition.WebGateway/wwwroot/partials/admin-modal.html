<!-- Admin & Super User Portal Modal Component -->
<div id="admin-modal" class="review-modal-overlay" style="display: none;">
  <div class="review-card admin-modal-card" style="max-width: min(96vw, 1100px); max-height: 90vh; display: flex; flex-direction: column;">
    <div class="review-header" style="flex-shrink: 0;">
      <div>
        <div class="hud-title">SuperAdmin & Governance Console</div>
        <h2 style="font-size: 1.25rem; font-weight: 700;">User & Tier Management</h2>
      </div>
      <button type="button" id="btn-close-admin-modal" class="btn btn-sm">✕</button>
    </div>

    <!-- Admin Navigation Tabs -->
    <div class="mode-switcher" style="margin-bottom: 1rem; align-self: flex-start; flex-shrink: 0;">
      <button type="button" id="btn-admin-tab-users" class="mode-btn active">👥 User Directory</button>
      <button type="button" id="btn-admin-tab-tiers" class="mode-btn">⚙️ Tier Configurations</button>
      <button type="button" id="btn-admin-tab-logs" class="mode-btn">📡 AI Usage Telemetry</button>
    </div>

    <!-- Pane 1: User Directory -->
    <div id="admin-pane-users" class="admin-pane" style="flex: 1; overflow-y: auto; min-height: 0;">
      <div style="display: flex; gap: 0.75rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center;">
        <input type="text" id="admin-search-users" class="text-input" placeholder="Search by email or mobile..." style="flex: 1; min-width: 220px;">
        <select id="admin-filter-tier" class="text-input" style="width: auto;">
          <option value="">All Tiers</option>
          <option value="0">Free</option>
          <option value="1">Basic</option>
          <option value="2">Premium</option>
          <option value="3">SuperAdmin</option>
        </select>
        <button type="button" id="btn-admin-refresh-users" class="btn btn-sm btn-outline">🔄 Refresh</button>
      </div>

      <div class="table-responsive">
        <table class="admin-table">
          <thead>
            <tr>
              <th>User & Contact</th>
              <th>Role</th>
              <th>Tier</th>
              <th>Today AI</th>
              <th>Verification & DPDPA</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="admin-users-table-body">
            <tr>
              <td colspan="7" style="text-align: center; color: var(--text-muted); padding: 2rem;">Loading users...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Pane 2: Tier Configurations -->
    <div id="admin-pane-tiers" class="admin-pane" style="display: none; flex: 1; overflow-y: auto; min-height: 0;">
      <div id="admin-tier-cards-container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem;">
        <!-- Dynamically rendered tier cards -->
      </div>
    </div>

    <!-- Pane 3: AI Telemetry Logs -->
    <div id="admin-pane-logs" class="admin-pane" style="display: none; flex: 1; overflow-y: auto; min-height: 0;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
        <div style="font-size: 0.85rem; color: var(--text-secondary);">Realtime immutable audit trail from <code>AiUsageLogs</code></div>
        <button type="button" id="btn-admin-refresh-logs" class="btn btn-sm btn-outline">🔄 Refresh Logs</button>
      </div>
      <div class="table-responsive">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Time (UTC)</th>
              <th>User ID</th>
              <th>Operation</th>
              <th>Model</th>
              <th>Tokens</th>
              <th>Latency</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="admin-logs-table-body">
            <tr>
              <td colspan="7" style="text-align: center; color: var(--text-muted); padding: 2rem;">Loading telemetry...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
